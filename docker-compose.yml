version: '3.8'

services:
  myth-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: myth-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=jdbc:sqlite:/data/myth_metadata.db
      - VOLATILE_MESSAGE_TTL_SECONDS=60
      - SELF_DESTRUCT_COUNTDOWN_SECONDS=5
    volumes:
      - myth-data:/data

volumes:
  myth-data:
